name: Fix AFK start message format

on:
  push:
    branches:
      - peremogabyde2
    paths:
      - '.github/workflows/afk-start-format-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peremogabyde2
          fetch-depth: 0

      - name: Patch AFK start message
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java')
          s = path.read_text(encoding='utf-8')

          old = '''\tprivate void broadcastAfkStart(NetworkRoom room, AfkSession session) {\n\t\tString msg = Rukkit.getConfig().notification(\n\t\t\t\t"rukkit.afk.start",\n\t\t\t\t"AFK timer started.\\n'{adminName}' has {seconds} seconds to send any chat message",\n\t\t\t\t"adminName", session.admin.name,\n\t\t\t\t"seconds", session.remainingSeconds,\n\t\t\t\t"requesterName", session.requester.name);\n\t\troom.connectionManager.broadcastServerMessage(msg);\n\t}\n'''

          new = '''\tprivate void broadcastAfkStart(NetworkRoom room, AfkSession session) {\n\t\tString msg = "[" + session.requester.name + "] AFK timer started, '"\n\t\t\t\t+ session.admin.name + "' has " + session.remainingSeconds\n\t\t\t\t+ " seconds to send any chat message";\n\t\troom.connectionManager.broadcastServerMessage(msg);\n\t}\n'''

          if old not in s:
              raise SystemExit('Expected broadcastAfkStart block not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify source
        run: |
          grep -F '[" + session.requester.name + "] AFK timer started' src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java

      - name: Build Rukkit
        run: chmod +x ./gradlew && ./gradlew buildRukkit --no-daemon

      - name: Commit and remove migration workflow
        run: |
          rm -f .github/workflows/afk-start-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java .github/workflows/afk-start-format-fix.yml
          git commit -m 'Fix AFK start message format'
          git push origin HEAD:peremogabyde2
