name: Fix team safety and lobby auto-start

on:
  push:
    branches:
      - peremogabyde2
    paths:
      - '.github/workflows/fix-team-autostart.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peremogabyde2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          nr = Path('src/main/java/cn/rukkit/network/NetworkRoom.java')
          s = nr.read_text(encoding='utf-8')

          old = '''    private volatile boolean gameStartCountdownRunning = false;\n    private final AtomicInteger gameStartCountdownRemaining = new AtomicInteger(0);\n    private SaveManager saveManager;\n'''
          new = '''    private volatile boolean gameStartCountdownRunning = false;\n    private final AtomicInteger gameStartCountdownRemaining = new AtomicInteger(0);\n    private ScheduledFuture<?> autoStartForceFuture;\n    private final AtomicInteger autoStartForceRemaining = new AtomicInteger(0);\n    private volatile boolean autoStartForceBlocked = false;\n    private SaveManager saveManager;\n'''
          if old not in s:
              raise SystemExit('field block not found')
          s = s.replace(old, new, 1)

          old = '''    private void cancelGameEndGrace() {\n        if (gameEndGraceFuture != null) {\n            Rukkit.getThreadManager().shutdownTask(gameEndGraceFuture);\n            gameEndGraceFuture = null;\n        }\n        gameEndGraceRemaining.set(0);\n        if (isPaused) setPaused(false);\n    }\n\n    public boolean isPaused() {\n'''
          new = '''    private void cancelGameEndGrace() {\n        if (gameEndGraceFuture != null) {\n            Rukkit.getThreadManager().shutdownTask(gameEndGraceFuture);\n            gameEndGraceFuture = null;\n        }\n        gameEndGraceRemaining.set(0);\n        if (isPaused) setPaused(false);\n    }\n\n    private boolean hasOpposingTeams() {\n        Integer firstTeam = null;\n        for (RoomConnection connection : connectionManager.getConnections()) {\n            if (connection == null || connection.player == null || connection.player.isEmpty) continue;\n            if (firstTeam == null) {\n                firstTeam = connection.player.team;\n            } else if (connection.player.team != firstTeam) {\n                return true;\n            }\n        }\n        return false;\n    }\n\n    private synchronized void startAutoStartForceCountdown() {\n        if (autoStartForceFuture != null && !autoStartForceFuture.isDone()) return;\n\n        final int minPlayers = Math.max(1, Rukkit.getConfig().minStartPlayer);\n        if (Rukkit.getConfig().singlePlayerMode || connectionManager.size() < minPlayers || isGaming || gameStartCountdownRunning) return;\n\n        autoStartForceBlocked = false;\n        autoStartForceRemaining.set(120);\n        connectionManager.broadcastServerMessage(minPlayers + "+ players, game will force start in 2 mins or type .start");\n\n        autoStartForceFuture = Rukkit.getThreadManager().scheduleAtFixedRate(new Runnable() {\n            @Override\n            public void run() {\n                if (isGaming || Rukkit.getConfig().singlePlayerMode || connectionManager.size() < minPlayers || gameStartCountdownRunning) {\n                    cancelAutoStartForceCountdown();\n                    return;\n                }\n\n                int left = autoStartForceRemaining.decrementAndGet();\n                if (left == 60) {\n                    connectionManager.broadcastServerMessage(minPlayers + "+ players, game will force start in 1 min.");\n                } else if (left == 30 || left == 20 || left == 10 || left == 5) {\n                    connectionManager.broadcastServerMessage(minPlayers + "+ players, game will force start in " + left + " seconds.");\n                }\n\n                if (left <= 0) {\n                    if (hasOpposingTeams()) {\n                        cancelAutoStartForceCountdown();\n                        startGameNow();\n                    } else if (!autoStartForceBlocked) {\n                        autoStartForceBlocked = true;\n                        connectionManager.broadcastServerMessage("Game cannot start: no opposing team.");\n                    }\n                }\n            }\n        }, 1000, 1000, TimeUnit.MILLISECONDS);\n    }\n\n    private synchronized void cancelAutoStartForceCountdown() {\n        if (autoStartForceFuture != null) {\n            Rukkit.getThreadManager().shutdownTask(autoStartForceFuture);\n            autoStartForceFuture = null;\n        }\n        autoStartForceRemaining.set(0);\n        autoStartForceBlocked = false;\n    }\n\n    public synchronized void playerCountChanged() {\n        RukkitConfig cfg = Rukkit.getConfig();\n        int minPlayers = Math.max(1, cfg.minStartPlayer);\n        if (cfg.singlePlayerMode || isGaming || gameStartCountdownRunning || connectionManager.size() < minPlayers) {\n            cancelAutoStartForceCountdown();\n            return;\n        }\n        startAutoStartForceCountdown();\n    }\n\n    public boolean isPaused() {\n'''
          if old not in s:
              raise SystemExit('grace insertion block not found')
          s = s.replace(old, new, 1)

          old = '''        gameTaskFuture.cancel(true);\n        isGaming = false;\n        RoomStopGameEvent.getListenerList().callListeners(new RoomStopGameEvent(this));\n'''
          new = '''        gameTaskFuture.cancel(true);\n        isGaming = false;\n        RoomStopGameEvent.getListenerList().callListeners(new RoomStopGameEvent(this));\n        playerCountChanged();\n'''
          if old not in s:
              raise SystemExit('stopGame tail not found')
          s = s.replace(old, new, 1)

          old = '''    public synchronized void startGame() {\n        if (isGaming || gameStartCountdownRunning) {\n            return;\n        }\n\n        RukkitConfig rukkitConfig = Rukkit.getConfig();\n'''
          new = '''    public synchronized void startGame() {\n        if (isGaming || gameStartCountdownRunning) {\n            return;\n        }\n\n        if (!hasOpposingTeams()) {\n            connectionManager.broadcastServerMessage("Game cannot start: no opposing team.");\n            playerCountChanged();\n            return;\n        }\n        cancelAutoStartForceCountdown();\n\n        RukkitConfig rukkitConfig = Rukkit.getConfig();\n'''
          if old not in s:
              raise SystemExit('startGame head not found')
          s = s.replace(old, new, 1)

          old = '''    private void startGameNow() {\n        try {\n'''
          new = '''    private void startGameNow() {\n        if (!hasOpposingTeams()) {\n            connectionManager.broadcastServerMessage("Game cannot start: no opposing team.");\n            playerCountChanged();\n            return;\n        }\n        cancelAutoStartForceCountdown();\n        try {\n'''
          if old not in s:
              raise SystemExit('startGameNow head not found')
          s = s.replace(old, new, 1)

          nr.write_text(s, encoding='utf-8')

          rcm = Path('src/main/java/cn/rukkit/network/RoomConnectionManager.java')
          s = rcm.read_text(encoding='utf-8')
          s = s.replace('''        CHANNEL_GROUP.add(connection.handler.ctx.channel());\n    }\n\n    public void set''', '''        CHANNEL_GROUP.add(connection.handler.ctx.channel());\n        room.playerCountChanged();\n    }\n\n    public void set''', 1)
          s = s.replace('''        CHANNEL_GROUP.add(connection.handler.ctx.channel());\n    }\n\n    /**\n     * Broadcast a message''', '''        CHANNEL_GROUP.add(connection.handler.ctx.channel());\n        room.playerCountChanged();\n    }\n\n    /**\n     * Broadcast a message''', 1)
          s = s.replace('''        }\n\n        return true;\n    }\n\n    /**\n     * Disconnect all Connections.''', '''        }\n\n        room.playerCountChanged();\n        return true;\n    }\n\n    /**\n     * Disconnect all Connections.''', 1)
          rcm.write_text(s, encoding='utf-8')
          PY

      - name: Build Rukkit
        run: chmod +x ./gradlew && ./gradlew buildRukkit --no-daemon

      - name: Commit patch and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-team-autostart.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/cn/rukkit/network/NetworkRoom.java src/main/java/cn/rukkit/network/RoomConnectionManager.java .github/workflows/fix-team-autostart.yml
          git commit -m 'Add universal team safety and lobby auto-start'
          git push origin HEAD:peremogabyde2
