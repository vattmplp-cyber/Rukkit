name: Apply AFK and map filtering patch

on:
  push:
    paths:
      - '.github/workflows/patch-current-rukkit.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peremogabyde2
          fetch-depth: 0

      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path

          command_path = Path('src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java')
          text = command_path.read_text(encoding='utf-8')

          old = '''\tprivate boolean shouldAnnounceAfk(int seconds, int total) {
\t\tint interval = Math.max(1, Rukkit.getConfig().afkWarningIntervalSeconds);
\t\tint finalSeconds = Math.max(1, Rukkit.getConfig().afkFinalWarningSeconds);
\t\treturn seconds == total || seconds % interval == 0 || seconds <= finalSeconds;
\t}'''
          new = '''\tprivate boolean shouldAnnounceAfk(int seconds, int total) {
\t\tint interval = Math.max(1, Rukkit.getConfig().afkWarningIntervalSeconds);
\t\tint finalSeconds = Rukkit.getConfig().afkFinalWarningSeconds;
\t\treturn seconds == total
\t\t\t\t|| seconds % interval == 0
\t\t\t\t|| (finalSeconds > 0 && seconds == finalSeconds);
\t}'''
          if old not in text:
              raise SystemExit('AFK shouldAnnounceAfk block not found; refusing partial patch')
          text = text.replace(old, new, 1)

          text = text.replace(
              '"AFK timer started.\\n\'{adminName}\' has {seconds} seconds to send a chat message or perform an admin action.",',
              '"AFK timer started.\\n\'{adminName}\' has {seconds} seconds to send any chat message",',
              1
          )
          text = text.replace(
              '"\'{adminName}\' has {seconds} seconds to send a chat message or perform an admin action.",',
              '"\'{adminName}\' has {seconds} seconds to send any chat message",',
              1
          )
          command_path.write_text(text, encoding='utf-8', newline='\n')

          rukkit_path = Path('src/main/java/cn/rukkit/Rukkit.java')
          rukkit = rukkit_path.read_text(encoding='utf-8')

          marker = '\t\tconfig.applyDefaults();\n'
          insert = marker + '\t\tif (config.officialMapFilterEnabled) {\n\t\t\tcn.rukkit.game.map.OfficialMap.applyPlayerCountFilter(\n\t\t\t\t\tconfig.officialMapMinPlayers,\n\t\t\t\t\tconfig.officialMapMaxPlayers\n\t\t\t);\n\t\t}\n'
          if insert not in rukkit:
              if marker not in rukkit:
                  raise SystemExit('Rukkit config marker not found; refusing partial patch')
              rukkit = rukkit.replace(marker, insert, 1)
              rukkit_path.write_text(rukkit, encoding='utf-8', newline='\n')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-current-rukkit.yml
          git add src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java src/main/java/cn/rukkit/Rukkit.java .github/workflows/patch-current-rukkit.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix AFK warnings and wire official map filtering [skip patch]'
          git push origin HEAD:peremogabyde2
