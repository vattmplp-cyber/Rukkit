name: Build Rukkit

on:
  workflow_dispatch:
  push:
    branches:
      - "0.9.4"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Rukkit
        run: ./gradlew buildRukkit --no-daemon

      - name: Upload Rukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rukkit-0.9.4
          path: build/outputs/*
