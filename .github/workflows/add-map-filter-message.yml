name: Add universal map filter message

on:
  push:
    branches:
      - peremogabyde2
    paths:
      - '.github/workflows/add-map-filter-message.yml'
  workflow_dispatch:

permissions:
  contents: write

# One-time migration workflow: patches Java sources, builds, commits, then removes itself.
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: peremogabyde2
          fetch-depth: 0

      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          official = Path('src/main/java/cn/rukkit/game/map/OfficialMap.java')
          s = official.read_text(encoding='utf-8')
          if 'public static boolean isMapFilteredOut(String requested, int min, int max)' not in s:
              insert_at = s.rfind('\n}')
              method = '''\n\n    /**\n     * Returns true when a known official map exists in the complete catalog but\n     * is hidden by the configured player-count filter.\n     */\n    public static boolean isMapFilteredOut(String requested, int min, int max) {\n        if (requested == null || requested.trim().isEmpty()) return false;\n        if (min < 1) min = 1;\n        if (max < min) max = min;\n        String query = requested.trim().toLowerCase(java.util.Locale.ROOT);\n        for (int i = 0; i < ALL_MAPS.length; i++) {\n            String internal = ALL_MAPS[i];\n            String display = ALL_MAPS_NAME[i];\n            if (internal.toLowerCase(java.util.Locale.ROOT).contains(query)\n                    || display.toLowerCase(java.util.Locale.ROOT).contains(query)) {\n                int players = playerCount(internal);\n                return players >= 0 && (players < min || players > max);\n            }\n        }\n        return false;\n    }\n'''
              s = s[:insert_at] + method + s[insert_at:]
              official.write_text(s, encoding='utf-8')

          cmd = Path('src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java')
          s = cmd.read_text(encoding='utf-8')
          start = s.index('\tpublic static class MapsCallback implements ChatCommandListener {')
          end = s.index('\n\tpublic static class CustomMapsCallback implements ChatCommandListener {', start)
          new = '''\tpublic static class MapsCallback implements ChatCommandListener {\n\t\tprivate final int type;\n\t\tpublic MapsCallback(int type) { this.type = type; }\n\n\t\tprivate String mapFilterMessage() {\n\t\t\tint min = Rukkit.getConfig().officialMapMinPlayers;\n\t\t\tint max = Rukkit.getConfig().officialMapMaxPlayers;\n\t\t\tif (min == max) return \"Map selection is restricted to \" + min + \"-player maps on this server.\";\n\t\t\treturn \"Map selection is restricted to maps for \" + min + \"-\" + max + \" players on this server.\";\n\t\t}\n\n\t\t@Override\n\t\tpublic boolean onSend(RoomConnection con, String[] args) {\n\t\t\tif (type == 0) {\n\t\t\t\tStringBuilder build = new StringBuilder();\n\t\t\t\tif (args.length > 0) {\n\t\t\t\t\tbuild.append(\"- Maps -  Page \").append(args[0]).append(\" \\n\");\n\t\t\t\t\tint page = Integer.parseInt(args[0]) - 1;\n\t\t\t\t\tint from = Math.max(0, page * 10);\n\t\t\t\t\tint to = Math.min(OfficialMap.maps.length, from + 10);\n\t\t\t\t\tfor (int i = from; i < to; i++) build.append(String.format(\"[%d] %s\", i, OfficialMap.maps[i])).append(\"\\n\");\n\t\t\t\t} else {\n\t\t\t\t\tbuild.append(\"- Help -  Page 1 \\n\");\n\t\t\t\t\tint to = Math.min(10, OfficialMap.maps.length);\n\t\t\t\t\tfor (int i = 0; i < to; i++) build.append(String.format(\"[%d] %s\", i, OfficialMap.maps[i])).append(\"\\n\");\n\t\t\t\t}\n\t\t\t\tcon.sendServerMessage(build.toString());\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\tif (!con.player.isAdmin || args.length == 0) return false;\n\n\t\t\tif (args[0].startsWith(\"'\")) {\n\t\t\t\tString[] parts = args[0].split(\"'\");\n\t\t\t\tString mapString = parts.length > 1 ? parts[1] : args[0];\n\t\t\t\tboolean found = false;\n\t\t\t\tfor (int i = 0; i < OfficialMap.mapsName.length; i++) {\n\t\t\t\t\tif (OfficialMap.mapsName[i].toLowerCase(java.util.Locale.ROOT).contains(mapString.toLowerCase(java.util.Locale.ROOT))) {\n\t\t\t\t\t\tRukkit.getRoundConfig().mapName = OfficialMap.maps[i];\n\t\t\t\t\t\tRukkit.getRoundConfig().mapType = 0;\n\t\t\t\t\t\tfound = true;\n\t\t\t\t\t\ttry { con.currectRoom.broadcast(Packet.serverInfo(con.currectRoom.config)); con.handler.ctx.writeAndFlush(Packet.serverInfo(con.currectRoom.config, true)); } catch (IOException ignored) {}\n\t\t\t\t\t\tbreak;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif (!found && Rukkit.getConfig().officialMapFilterEnabled && OfficialMap.isMapFilteredOut(mapString, Rukkit.getConfig().officialMapMinPlayers, Rukkit.getConfig().officialMapMaxPlayers)) con.sendServerMessage(mapFilterMessage());\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\ttry {\n\t\t\t\tint id = Integer.parseInt(args[0]);\n\t\t\t\tif (id < 0 || id >= OfficialMap.maps.length) {\n\t\t\t\t\tcon.sendServerMessage(\"Invalid map selection. Use 'maps' to see the available maps.\");\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\t\t\t\tRukkit.getRoundConfig().mapName = OfficialMap.maps[id];\n\t\t\t\tRukkit.getRoundConfig().mapType = 0;\n\t\t\t} catch (NumberFormatException e) {\n\t\t\t\tcon.sendServerMessage(\"Invalid map selection. Use 'maps' to see the available maps.\");\n\t\t\t}\n\t\t\treturn false;\n\t\t}\n\t}\n'''
          s = s[:start] + new + s[end:]
          cmd.write_text(s, encoding='utf-8')
          PY

      - name: Build Rukkit
        run: chmod +x gradlew && ./gradlew buildRukkit --no-daemon

      - name: Commit patched sources
        run: |
          rm -f .github/workflows/add-map-filter-message.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/cn/rukkit/game/map/OfficialMap.java src/main/java/cn/rukkit/plugin/internal/CommandPlugin.java .github/workflows/add-map-filter-message.yml
          git commit -m 'Add universal official map filter message'
          git push origin HEAD:peremogabyde2
