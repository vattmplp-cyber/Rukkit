name: Apply stable network tick timing fix

on:
  push:
    branches:
      - peremogabyde2
    paths:
      - '.github/workflows/apply-network-timing-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: peremogabyde2
          fetch-depth: 0

      - name: Apply timing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tm = Path('src/main/java/cn/rukkit/service/ThreadManager.java')
          s = tm.read_text(encoding='utf-8')
          if 'scheduleAtFixedRate(Runnable runnable' not in s:
              marker = '''\tpublic Future submit(Runnable runnable) {\n'''
              method = '''\t/**\n\t * Schedule a periodic task against the executor's fixed-rate monotonic clock.\n\t * This avoids accumulating delay when a previous invocation takes slightly longer.\n\t */\n\tpublic ScheduledFuture<?> scheduleAtFixedRate(Runnable runnable, long initialDelay, long period, TimeUnit unit) {\n\t\treturn executorService.scheduleAtFixedRate(runnable, initialDelay, period, unit);\n\t}\n\n'''
              if marker not in s:
                  raise SystemExit('ThreadManager insertion marker not found')
              s = s.replace(marker, method + marker, 1)
              tm.write_text(s, encoding='utf-8')

          tick = Path('src/main/java/cn/rukkit/network/NetworkTick.java')
          if not tick.exists():
              tick.write_text('''package cn.rukkit.network;\n\nimport java.util.concurrent.TimeUnit;\n\n/** Shared timing constants for the Rusted Warfare network simulation tick. */\npublic final class NetworkTick {\n    /** The original protocol advances ten simulation frames per network tick. */\n    public static final int FRAMES_PER_WINDOW = 10;\n\n    /**\n     * Ten frames at 60 simulation frames per second. Nanoseconds keep the\n     * schedule accurate without millisecond rounding drift.\n     */\n    public static final long WINDOW_PERIOD_NANOS = TimeUnit.SECONDS.toNanos(1) / 6;\n\n    /** Human-readable approximation for existing diagnostics. */\n    public static final int WINDOW_PERIOD_MILLIS = 167;\n\n    private NetworkTick() {}\n}\n''', encoding='utf-8')

          nr = Path('src/main/java/cn/rukkit/network/NetworkRoom.java')
          s = nr.read_text(encoding='utf-8')

          if 'NetworkTick.WINDOW_PERIOD_NANOS' not in s:
              s2 = s.replace('    public int stepRate = 200;\n', '    public int stepRate = NetworkTick.WINDOW_PERIOD_MILLIS;\n', 1)
              if s2 == s:
                  raise SystemExit('NetworkRoom stepRate marker not found')
              s = s2

              s2 = s.replace('                currentStep += 10;\n', '                currentStep += NetworkTick.FRAMES_PER_WINDOW;\n', 2)
              if s2 == s:
                  raise SystemExit('NetworkRoom currentStep marker not found')
              s = s2

              old = '            gameTaskFuture = Rukkit.getThreadManager().schedule(new GameTask(), stepRate, stepRate);\n'
              new = '''            gameTaskFuture = Rukkit.getThreadManager().scheduleAtFixedRate(\n                    new GameTask(),\n                    NetworkTick.WINDOW_PERIOD_NANOS,\n                    NetworkTick.WINDOW_PERIOD_NANOS,\n                    TimeUnit.NANOSECONDS);\n'''
              if old not in s:
                  raise SystemExit('NetworkRoom GameTask scheduling marker not found')
              s = s.replace(old, new, 1)
              if 'import java.util.concurrent.TimeUnit;' not in s:
                  s = s.replace('import java.util.concurrent.ScheduledFuture;\n', 'import java.util.concurrent.ScheduledFuture;\nimport java.util.concurrent.TimeUnit;\n', 1)
              nr.write_text(s, encoding='utf-8')

          PY

      - name: Build Rukkit
        run: chmod +x ./gradlew && ./gradlew buildRukkit --no-daemon

      - name: Commit timing fix and remove migration workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-network-timing-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/cn/rukkit/service/ThreadManager.java src/main/java/cn/rukkit/network/NetworkTick.java src/main/java/cn/rukkit/network/NetworkRoom.java .github/workflows/apply-network-timing-fix.yml
          if git diff --cached --quiet; then
            echo 'No timing changes needed.'
            exit 0
          fi
          git commit -m 'Improve network tick timing stability'
          git push origin HEAD:peremogabyde2
